kind: VerticalPodAutoscaler
apiVersion: autoscaling.k8s.io/v1
metadata:
  name: backend-vpa
  namespace: three
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: backend-deployment
  updatePolicy:
    updateMode: "Recreate" 
  resourcePolicy:
    containerPolicies:
    -  containerName: "backend-container"
       minAllowed:
         cpu: 100m
         memory: 65Mi
       maxAllowed:
         cpu: 120m
         memory: 100Mi
    
       controlledResources:
       - cpu
       - memory
       controlledValues: RequestsAndLimits
