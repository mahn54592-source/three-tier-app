kind: Deployment
apiVersion: apps/v1
metadata:
  name: backend-deployment
  namespace: three
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: izumi09/three-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_CONN_STR
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_CONN_STR
          startupProbe:
            httpGet:
              path: /ok
              port: 8080
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ok
              port: 8080
            initialDelaySeconds: 7
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ok
              port: 8080
            initialDelaySeconds: 6
            periodSeconds: 3
          resources:
            requests:
              memory: 65Mi
              cpu: 100m
            limits:
              memory: 160Mi
              cpu: 250m
